# CouchDB local para desenvolvimento, como no material da disciplina.
#
#   docker compose up -d
#   flask --app app init-db
#   flask --app app seed-db
#
# Fauxton, a interface web do CouchDB: http://127.0.0.1:5984/_utils/
#
# admin/admin vale SÓ para a máquina local — por isso a porta fica presa ao
# 127.0.0.1 e não aparece para a rede. Em produção o banco é o IBM Cloudant,
# com credencial própria em variável de ambiente.
services:
  couchdb:
    image: couchdb:3.5
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb_dados:/opt/couchdb/data

volumes:
  couchdb_dados:
